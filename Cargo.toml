[package]
name = "snurr"
version = "0.15.0-wip"
edition = "2024"
rust-version = "1.88"
authors = ["sajox"]
description = "Read BPMN 2.0 files and run the process flow"
readme = "README.md"
license = "MIT"
repository = "https://github.com/sajox/snurr"
keywords = ["bpmn", "workflow", "engine"]

include = ["Cargo.toml", "LICENSE", "/src", "/examples", "/docs"]

[lints.rust]
unsafe_code = "forbid"

[[example]]
name = "counter"

[[example]]
name = "reusable"

[dependencies]
quick-xml = { git = "https://github.com/tafia/quick-xml.git", rev = "daa7b91b872a3c78a3a3b6eecb48a44f33911d59" }
log = "0.4"
rayon = { version = "1", optional = true }

[features]
default = []
parallel = ["dep:rayon"]

[dev-dependencies]
pretty_env_logger = "0.5"
